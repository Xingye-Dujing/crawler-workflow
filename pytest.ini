[pytest]
testpaths = tests
addopts = --disable-socket -m "not integration and not live_ollama"
markers =
    unit: pure logic tests, no I/O beyond tmp files
    api: Flask test_client tests against a fully tmp-isolated application
    integration: needs the local Chrome + chromedriver to render file:// fixtures
    live_ollama: needs the local Ollama daemon (skips cleanly when unreachable)
    serial: mutates process-global stdout via the execute worker, must not run concurrently
filterwarnings =
    ignore::DeprecationWarning
