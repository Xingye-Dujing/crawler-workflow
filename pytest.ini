[pytest]
testpaths = tests
addopts = --disable-socket -m "not integration and not live_ollama and not live_site and not live_quick"
markers =
    unit: pure logic tests, no I/O beyond tmp files
    api: Flask test_client tests against a fully tmp-isolated application
    integration: needs the local Chrome + chromedriver to render file:// fixtures
    live_ollama: needs the local Ollama daemon (skips cleanly when unreachable)
    live_site: real crawl against live sites with saved cookies; skips when the cookie is absent
    live_quick: the subset of live_site that visits each platform exactly once — the tier to run
        before every change, because a full live_site pass costs an hour of real crawling
    serial: mutates process-global stdout via the execute worker, must not run concurrently
filterwarnings =
    ignore::DeprecationWarning
