name: ci

# Two jobs, run on every push, every pull request and by hand.
#
# `fast` — ruff, both pylint standards and the fast tier: no browser, no daemon, no account.
# `browser` — the device tier's Chrome half: real Chrome driven by the real UI tests, with
#             CRAWLER_REQUIRE_BROWSER so a driver that cannot start FAILS instead of skipping,
#             and CRAWLER_REQUIRE_NODE so the ~43 frontend JS cases cannot hide as skips.
#
# What stays a LOCAL obligation, stated rather than pretended: the Ollama-marked cases (they want a
# daemon with models pulled on the box), the CatBus adapter cases (the adapter is a separate,
# unpublished checkout — a runner has nothing to install), the desktop rebuild (a frozen exe has to
# be double-clicked on a real Windows desktop), and live_quick / live_site (they spend the user's
# accounts, so AGENTS.md forbids running them unattended anywhere, including CI). A green check here
# is therefore evidence about the browser and the code, never "all tiers passed".
#
# windows-latest rather than ubuntu-latest on purpose: every verification this project has ever had
# was on Windows, and changing platform and adding a first CI run in the same step turns one unknown
# into two. Widening to Linux is its own change, with the failures read.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Node is on the runner image; requiring it turns "the JS tier silently skipped" into a red run.
  CRAWLER_REQUIRE_NODE: '1'

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create the venv the project mandates
        run: python -m venv .venv

      - name: Install declared dependencies
        run: .venv/Scripts/python.exe -m pip install --upgrade pip -r requirements.txt

      # Formatting is checked HERE and not only in the local hook, because the hook cannot
      # run everywhere: `ruff format` writes through a temporary file and a rename, which a
      # restricted workspace refuses outright — measured, it fails with os error 5 and the
      # edit silently stays unformatted. This step is the gate that cannot be skipped.
      - name: Lint
        run: .venv/Scripts/ruff.exe check backend/ tests/

      - name: Format
        run: .venv/Scripts/ruff.exe format --check backend/ tests/

      # Pylint runs THREE times with three standards, because the honest answer differs by tree:
      # product code may not be exempt from anything; `tests/` is exempt only from the three
      # messages pytest's design makes meaningless (fixture-name shadowing, fixture arguments that
      # ARE the usage, deliberate white-box private access); `backend/test_*.py` are the manual
      # measurement scripts AGENTS.md keeps out of pytest, whose sys.path bootstrap must precede
      # their imports. Nested config files are NOT read by pylint (measured), so each tier is its
      # own invocation with an explicit --rcfile. Targets are listed as FILES, never as bare
      # directory names: a folder called `packaging` would resolve to the PyPA distribution in
      # site-packages instead of this repository (the folder is `desktop/` now, and the rule stays),
      # and every step refuses an empty target list, because a gate that silently checks nothing is
      # worse than no gate.
      #
      # `--disable=C,R --fail-on=W,E,F` is the standard the user set: FATAL, ERROR and WARNING must
      # be zero. It is scoped on the COMMAND LINE, never in the tier configs, so nothing is hidden
      # from a local run. pylint's exit code is a bitmap of the categories it saw, and CONVENTION
      # and REFACTOR advice is present by design — the lazy imports that break real cycles are
      # `import-outside-toplevel`, and they are deliberate — so without the scoping the gate would be
      # red forever and everyone would learn to ignore it. Run the same command without the flags to
      # see what is being waived.
      # Targets are enumerated as FILES, never as bare directory names: a folder called `packaging`
      # would resolve to the PyPA distribution in site-packages instead of this repository (the folder
      # is `desktop/` now, and the rule stays). The `@(...)` block uses STATEMENTS, not a comma list:
      # `@( (Get-ChildItem a), (Get-ChildItem b) ) | ForEach-Object FullName` builds an array of TWO
      # arrays, and `FullName` asked of an array is not a member — measured on the runner, that shape
      # passed pylint two empty arguments and pylint answered "No files to lint: exiting." with exit 1.
      # Loud, which is the point: a gate that reports success over an empty list is worse than none.
      - name: Pylint — product
        run: |
          $targets = @(
            Get-ChildItem backend -Recurse -Filter *.py -File | Where-Object Name -notlike 'test_*'
            Get-ChildItem desktop, tools, 'ml_train/scripts' -Filter *.py -File
          ) | ForEach-Object { $_.FullName }
          if (-not $targets) { throw 'no product sources found to lint' }
          Write-Output "linting $($targets.Count) product files"
          .venv/Scripts/pylint.exe --persistent=n --rcfile=.pylintrc --disable=C,R --fail-on=W,E,F --jobs=2 $targets

      - name: Pylint — tests
        run: |
          $targets = @(Get-ChildItem tests -Recurse -Filter *.py -File | ForEach-Object { $_.FullName })
          if (-not $targets) { throw 'no test sources found to lint' }
          Write-Output "linting $($targets.Count) test files"
          .venv/Scripts/pylint.exe --persistent=n --rcfile=.pylintrc.tests --disable=C,R --fail-on=W,E,F --jobs=2 $targets

      # NO third CI step on purpose. The measurement scripts (`backend/test_*.py`) are gitignored on
      # purpose — see .gitignore — so a hosted runner has zero of them to lint. A CI step that
      # "passed" over an empty target list would be exactly the silent green this workflow refuses
      # to produce, so the third tier (`.pylintrc.probes`) is a LOCAL standard: run it before
      # handing a probe to anyone, with
      #     .venv/Scripts/pylint.exe --rcfile=.pylintrc.probes (Get-ChildItem backend -Filter test_*.py)

      # `node` is on the runner image, so the frontend harness cases run rather than skip.
      # `-rs` prints every skip with its reason: a tier that "passed" while cases skipped is the
      # failure shape this repo has been bitten by twice, and the summary line alone hides it.
      - name: Fast tier
        run: .venv/Scripts/python.exe -m pytest -q -rs

  # The device tier's Chrome half. This is the only part of the local "全部门禁" chain a hosted
  # runner can honestly run: the cases drive a real browser over file:// fixtures, so they need no
  # account, no daemon and no network beyond Selenium Manager fetching a matching driver.
  #
  # CRAWLER_REQUIRE_BROWSER=1 is the point of the job. Without it a machine whose chromedriver
  # starts-and-crashes skips every browser case and the job still reports success — measured locally
  # as a run printing "191 passed" beside one silent skip. With it, an unavailable browser is an
  # error, and `tests/device_policy.py` routes every per-case driver failure through that rule.
  browser:
    runs-on: windows-latest
    timeout-minutes: 40
    needs: fast

    env:
      CRAWLER_REQUIRE_BROWSER: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create the venv the project mandates
        run: python -m venv .venv

      - name: Install declared dependencies
        run: .venv/Scripts/python.exe -m pip install --upgrade pip -r requirements.txt

      # `-m integration` selects the browser cases; the Ollama-marked half of the device tier is
      # left out because the runner has no daemon, and the CatBus adapter cases will report themselves
      # as skipped for the same reason (the adapter is a separate, unpublished checkout).
      - name: Device tier — real Chrome
        run: .venv/Scripts/python.exe -m pytest -q -m integration -rs

