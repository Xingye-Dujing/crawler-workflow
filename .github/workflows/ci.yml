name: ci

# Two jobs, run on every push, every pull request and by hand, on the three systems this project
# runs on: Windows (development), Linux (the cloud deployment target) and macOS.
#
# `fast` — ruff, both pylint standards and the fast tier: no browser, no daemon, no account.
# `browser` — the device tier's Chrome half: real Chrome driven by the real UI tests, with
#             CRAWLER_REQUIRE_BROWSER so a driver that cannot start FAILS instead of skipping,
#             and CRAWLER_REQUIRE_NODE so the ~43 frontend JS cases cannot hide as skips.
# `docker`  — the deployment image actually builds and boots. A Dockerfile no runner ever built is
#             a claim, not a deployment: the base tag, the apt suite and the dependency set drift
#             silently until an operator hits them. It builds with upstream mirrors because the
#             image's defaults are the China mirrors its operator uses.
#
# The lint targets are enumerated by `tools/ci_lint_tiers.py` rather than by a shell, because the
# gate must ask the same question on every runner: a PowerShell-only enumeration would turn the
# workflow into a Windows fact the moment a Linux job was added. That script passes explicit FILES
# (a bare directory name can resolve to an installed distribution in site-packages), prints how many
# it linted, and fails on an empty list.
#
# What stays a LOCAL obligation, stated rather than pretended: the Ollama-marked cases (they want a
# daemon with models pulled on the box), the CatBus adapter cases (the adapter is a separate,
# unpublished checkout — a runner has nothing to install), the desktop rebuild (a frozen exe has to
# be double-clicked on a real desktop), and live_quick / live_site (they spend the user's accounts,
# so AGENTS.md forbids running them unattended anywhere, including CI). A green check here is
# therefore evidence about the browser and the code on three platforms, never "all tiers passed".
#
# The runner matrix is deliberate: Windows remains the baseline, Ubuntu is the deployment target,
# and macOS is in the product's supported set. A missing runner is a review decision, never an
# accidental deletion.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      # First-run triage only: a manual dispatch may let the Ubuntu/macOS jobs fail without
      # failing the run, so their failures can be read and fixed before the gate blocks pushes.
      # Push and pull-request runs are always blocking.
      probe:
        description: 'Let the Ubuntu/macOS jobs fail without failing the run (first-run triage only)'
        type: boolean
        default: false

env:
  # Node is on the runner image, but setup-node pins it: requiring node turns "the JS tier
  # silently skipped" into a red run, and an image change must not silently remove the tier.
  CRAWLER_REQUIRE_NODE: '1'

jobs:
  fast:
    strategy:
      # One operating system failing must not hide the others' answer.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            python: .venv/Scripts/python.exe
          - runner: ubuntu-latest
            python: .venv/bin/python
          - runner: macos-15
            python: .venv/bin/python
    runs-on: ${{ matrix.runner }}
    # Triage escape hatch only (see the workflow_dispatch input above); normal runs are blocking.
    continue-on-error: ${{ github.event.inputs.probe == 'true' && matrix.runner != 'windows-latest' }}
    # 45, not 30: a green fast job was measured at 29m40s (26m49s of it the pytest tier), so 30
    # left one slow case between green and a timeout — and a timeout reports as a cancelled run,
    # never as the test that hung.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create the venv the project mandates
        run: python -m venv .venv

      - name: Install declared dependencies
        run: ${{ matrix.python }} -m pip install --upgrade pip -r requirements.txt

      # `requirements.txt` installs pywebview on Windows and macOS because the desktop window
      # needs it. Linux never runs that window, but the product pylint tier lints `desktop/`, and
      # pylint resolves the function-level `import webview` in `native_window.py`/`macos_entry.py`.
      # Installing the already-declared package here keeps the lint gate honest without adding a
      # GUI stack to the Linux server's runtime set.
      - name: Install the declared desktop package for the Linux lint tier
        if: runner.os == 'Linux'
        run: ${{ matrix.python }} -m pip install 'pywebview==6.2.1'

      # Formatting is checked HERE and not only in the local hook, because the hook cannot
      # run everywhere: `ruff format` writes through a temporary file and a rename, which a
      # restricted workspace refuses outright — measured, it fails with os error 5 and the
      # edit silently stays unformatted. This step is the gate that cannot be skipped.
      - name: Lint
        run: ${{ matrix.python }} -m ruff check backend/ tests/ desktop/ tools/

      - name: Format
        run: ${{ matrix.python }} -m ruff format --check backend/ tests/ desktop/ tools/

      # Pylint runs on all three tiers that a runner can honestly run. The third tier
      # (`.pylintrc.probes`) stays local: `backend/test_*.py` are gitignored measurement scripts,
      # so a hosted runner has none of them, and a step that "passed" over an empty list would be
      # the silent green this project refuses.
      #
      # The enumeration lives in `tools/ci_lint_tiers.py`; it prints `linting N ... files` and
      # exits non-zero when a tier has no sources. The standard is scoped on the command line
      # (`--disable=C,R --fail-on=W,E,F`) so nothing is hidden from a local run.
      - name: Pylint — product
        run: ${{ matrix.python }} tools/ci_lint_tiers.py product

      - name: Pylint — tests
        run: ${{ matrix.python }} tools/ci_lint_tiers.py tests

      # The local probes command is documented here but never run:
      #     .venv/Scripts/pylint.exe --rcfile=.pylintrc.probes (Get-ChildItem backend -Filter test_*.py)
      # `backend/test_*.py` are gitignored, so CI has no third tier to lint.

      # `-rs` prints every skip with its reason: a tier that "passed" while cases skipped is the
      # failure shape this repo has been bitten by twice, and the summary line alone hides it.
      - name: Fast tier
        run: ${{ matrix.python }} -m pytest -q -rs --junitxml=ci-fast-${{ matrix.runner }}.xml

      - name: Keep the pytest report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fast-${{ matrix.runner }}
          path: ci-fast-${{ matrix.runner }}.xml
          if-no-files-found: ignore

  # The device tier's Chrome half. The cases drive a real browser over file:// fixtures, so they
  # need no account, no daemon and no network beyond the driver that Selenium Manager fetches.
  #
  # CRAWLER_REQUIRE_BROWSER=1 is the point of the job. Without it a machine whose chromedriver
  # starts-and-crashes skips every browser case and the job still reports success — measured locally
  # as a run printing "191 passed" beside one silent skip. With it, an unavailable browser is an
  # error, and `tests/device_policy.py` routes every per-case driver failure through that rule.
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            python: .venv/Scripts/python.exe
          - runner: ubuntu-latest
            python: .venv/bin/python
          - runner: macos-15
            python: .venv/bin/python
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ github.event.inputs.probe == 'true' && matrix.runner != 'windows-latest' }}
    timeout-minutes: 50

    env:
      CRAWLER_REQUIRE_BROWSER: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create the venv the project mandates
        run: python -m venv .venv

      - name: Install declared dependencies
        run: ${{ matrix.python }} -m pip install --upgrade pip -r requirements.txt

      # A browser that renders Chinese text needs Chinese fonts. The Docker image installs the same
      # two packages (`deploy/Dockerfile`), so the Ubuntu runner measures the deployment shape
      # rather than a font-less image that makes every CJK label fall back to boxes.
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei

      # Ubuntu's runner image carries Chrome. Keep a named fallback rather than letting a missing
      # browser become a skipped tier; Selenium Manager fetches the matching driver.
      - name: Ensure Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && [ ! -x /usr/bin/chromium ]; then
            sudo apt-get install -y google-chrome-stable
          fi

      # macOS runners carry Chrome.app in the image; install it only if that changes.
      - name: Ensure Chrome (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -d '/Applications/Google Chrome.app' ]; then
            brew install --cask google-chrome
          fi

      - name: Report the browser (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          google-chrome --version 2>/dev/null || chromium --version 2>/dev/null || \
            '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version 2>/dev/null || true

      # `-m integration` selects the browser cases; the Ollama-marked half of the device tier is
      # left out because the runner has no daemon, and the CatBus adapter cases report themselves
      # as skipped for the same reason (the adapter is a separate, unpublished checkout).
      - name: Device tier — real Chrome
        run: ${{ matrix.python }} -m pytest -q -m integration -rs --junitxml=ci-browser-${{ matrix.runner }}.xml

      - name: Keep the pytest report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-browser-${{ matrix.runner }}
          path: ci-browser-${{ matrix.runner }}.xml
          if-no-files-found: ignore

  # The deployment shape (Linux + Docker). Build alone would pass on an image that never starts:
  # the entrypoint drops privileges with setpriv, the app bootstraps the first administrator from
  # CRAWLER_ADMIN_PASSWORD, and the gate must answer /api/config. So this job builds, runs, and
  # waits for a real 200 — a boot that exits is a red job with its own log below.
  #
  # Upstream mirrors, not the image defaults: a runner outside China cannot reach the Aliyun apt
  # mirror, and the base is Docker Hub's python:3.11-slim rather than the DaoCloud copy.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build the deployment image
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg BASE_IMAGE=python:3.11-slim \
            --build-arg APT_MIRROR=deb.debian.org \
            --build-arg PIP_INDEX=https://pypi.org/simple \
            --tag cixi-ci:latest .

      - name: Boot it and wait for /api/config
        run: |
          # A login is enabled by CRAWLER_ADMIN_PASSWORD, and a login on the repository's default
          # SECRET_KEY is refused at boot by name (a published signing key can forge a session).
          # The container log said exactly that while this job waited two minutes for a 200.
          docker run --detach --name cixi-ci \
            -e SECRET_KEY=ci-only-session-signing-key-not-a-secret \
            -e CRAWLER_ADMIN_PASSWORD=ci-bootstrap-not-a-secret \
            -p 5000:5000 cixi-ci:latest
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/config || true)
            if [ "$code" = "200" ]; then
              echo "the image booted and answered /api/config with 200"
              exit 0
            fi
            sleep 2
          done
          echo "the image never answered /api/config"
          exit 1

      - name: Container log on failure
        if: failure()
        run: docker logs cixi-ci || true

      - name: Stop the container
        if: always()
        run: docker rm --force cixi-ci || true
