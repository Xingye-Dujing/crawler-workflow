name: Build macOS DMG

# macOS releases are built on GitHub's macOS runners: the .app must be compiled on the target OS
# (PyInstaller cannot cross-compile), and the DMG needs hdiutil. Both architectures upload to the
# same release; the file name carries the architecture so they do not collide.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to upload the DMGs to
        required: true
        default: exe-2026-11
  push:
    tags:
      - "macos-*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'exe-2026-11' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-runtime.txt pyinstaller

      - name: Build .app and DMG
        run: python desktop/build_macos.py --clean

      - name: Build macOS online installer
        run: |
          python desktop/build_macos_installer.py --clean \
            --app-dmg "dist/CaiXiHui-macOS-${{ matrix.arch }}.dmg" \
            --release-tag "$RELEASE_TAG" \
            --arch "${{ matrix.arch }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: caixihui-macos-${{ matrix.arch }}
          path: |
            dist/CaiXiHui-macOS-*.dmg
            dist/CaiXiHui-Online-Setup-macOS-*.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/CaiXiHui-macOS-*.dmg \
            dist/CaiXiHui-Online-Setup-macOS-*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber
