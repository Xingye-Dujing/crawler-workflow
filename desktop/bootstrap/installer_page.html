<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>采析绘安装器</title>
  <link rel="icon" href="icon.ico">
  <style>{{CSS}}</style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div class="brand-row">
        <h1 id="title"></h1>
        <div class="lang">
          <button type="button" id="theme" aria-label="">
            <svg class="icon icon-moon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.8 5.8 0 1 0 6.8 6.8z"
                    fill="none" stroke="currentColor" stroke-width="1.3"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="icon icon-sun" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"
                    fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" data-lang="zh" aria-pressed="true">中文</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <p class="intro" id="intro"></p>
    </header>

    <div class="scroll">
    <section>
      <h2 id="dir-label"></h2>
      <div class="path-row">
        <input type="text" id="root" spellcheck="false" autocomplete="off">
        <button type="button" id="browse-root"></button>
      </div>
    </section>

    <section>
      <h2 id="data-label"></h2>
      <div class="path-row">
        <input type="text" id="data" spellcheck="false" autocomplete="off">
        <button type="button" id="browse-data"></button>
      </div>
      <p class="hint" id="data-hint"></p>
    </section>

    <section id="bert-section">
      <h2 id="bert-label"></h2>
      <p class="hint" id="models-preview"></p>
      <div class="path-row">
        <input type="text" id="bert" spellcheck="false" autocomplete="off">
        <button type="button" id="browse-bert"></button>
      </div>
      <p class="hint" id="bert-hint"></p>
    </section>

    <section>
      <h2 id="preset-label"></h2>
      <div class="presets">
        <label class="choice">
          <input type="radio" name="preset" value="one">
          <span id="preset-one"></span>
        </label>
        <label class="choice">
          <input type="radio" name="preset" value="app">
          <span id="preset-app"></span>
        </label>
        <label class="choice" id="shortcut-choice">
          <input type="checkbox" id="shortcut" checked>
          <span id="shortcut-label"></span>
        </label>
      </div>
    </section>

    <section>
      <h2 id="components-label"></h2>
      <div class="components" id="components"></div>
      <p class="hint" id="feed-note" aria-live="polite"></p>
      <div class="notes">
        <p id="vpn"></p>
        <p id="license"></p>
      </div>
      <p class="total" id="total"></p>
    </section>

    <section class="run">
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="bar"></span>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="log" id="log" aria-live="polite"></div>
    </section>

    <div class="notice" id="notice" hidden></div>
    </div>

    <footer class="actions">
      <button type="button" class="primary" id="install"></button>
      <button type="button" id="cancel" disabled></button>
      <span class="spacer"></span>
      <button type="button" id="open"></button>
      <button type="button" id="quit"></button>
    </footer>
  </main>

  <div class="overlay" id="doctor" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="doctor-title">
      <h3 id="doctor-title"></h3>
      <div class="rows" id="doctor-rows"></div>
      <div class="buttons">
        <button type="button" class="primary" id="doctor-launch"></button>
        <span class="spacer"></span>
        <button type="button" id="doctor-close"></button>
      </div>
    </div>
  </div>

  <script>{{CONFIG}}</script>
  <script src="installer_page.js"></script>
</body>
</html>
